name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.database.name }})
    runs-on: ubuntu-latest

    # StarDust refuses anything below MariaDB 10.11 or MySQL 8.0.13, and
    # the two engines differ in ways it cares about, so every change runs
    # against both floors.
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB 10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -proot

    services:
      database:
        image: ${{ matrix.database.image }}
        # The MariaDB image accepts the MYSQL_* names too.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: starsystem_testing
          MYSQL_USER: starsystem
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # Real environment variables win over both .env and phpunit.xml, so
    # setup's migrate and the test suite reach the service container.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: starsystem_testing
      DB_USERNAME: starsystem
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
